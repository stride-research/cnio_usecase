name: CageFlow baseline

# Every merge to main, no path filter, no nightly cron -- "no need to be nightly,"
# per Javier. Purely informational: posts the run's own numbers, no pass/fail
# judgment, no stored comparison file to go stale.
on:
  push:
    branches: [main]

jobs:
  baseline:
    runs-on: [self-hosted, scitech]
    timeout-minutes: 240
    env:
      RUNDIR: /data/biostructure/users/javidsegura/cnio_flowgentic/ci_runs/baseline-${{ github.sha }}
    steps:
      - id: run
        # Swap to big_config.json here once Laura's representative config is
        # committed to the repo (config/big_config.json) -- a one-line change.
        # Still the small default test config until then.
        run: scripts/ci_run.sh ${{ github.sha }} "$RUNDIR"

      - if: cancelled()
        run: scancel "$(cat "$RUNDIR/.jobid")"

      - if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          {
            echo "### CageFlow baseline -- $OUTCOME"
            echo "wall_s: $(cat "$RUNDIR/results/wall_s.txt" 2>/dev/null || echo n/a)"
            echo "path: \`$RUNDIR\`"
            echo
            echo "_Informational only -- no stored comparison, no pass/fail judgment._"
          } >> "$GITHUB_STEP_SUMMARY"
